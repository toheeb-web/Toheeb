name: chopconnect_flutter
description: ChopConnect Mobile Flutter App with Flutterwave Split Payments
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Official Flutterwave Standard package
  flutterwave_standard: ^1.0.8
  # Networking for secure backend communication
  http: ^1.2.0
  # State management & persistence
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
